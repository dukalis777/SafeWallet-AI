name: Validate SafeWallet AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          for file in src/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Check required extension files
        run: |
          test -f popup.html
          test -f src/goplus.js
          test -f src/allowance.js
          test -f src/etherscan.js
          test -f src/approvals-scan.js
          test -f src/approvals-scan.js
          test -f src/popup.js
          test -f src/styles.css
